# Stockwoven on Fly.io. From app/:
#   fly apps create <name>            # once; names are global, so pick a free one and put it below
#   fly secrets set FAUCET_SECRET_KEY="$(cat faucet-keypair.json)"   # optional: the devnet faucet
#   fly deploy --ha=false             # one machine: the faucet's limits live in its memory
#
# The faucet key only mints the devnet test tokens. Never set the program's upgrade authority here.

app = "stockwoven"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    # Baked into the browser bundle. A private RPC (Helius, QuickNode...) with its key restricted to
    # this domain makes the app steadier than the public devnet endpoint.
    NEXT_PUBLIC_RPC_URL = "https://api.devnet.solana.com"

[env]
  # The RPC the server (faucet) uses.
  RPC_URL = "https://api.devnet.solana.com"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
