# Stockwoven (site + app + docs + /api) atrás do nginx.
#
# Diferente de um frontend estático com backend separado: aqui tudo é um único servidor
# Next.js (node server.js, porta 3100). As páginas e a rota /api/faucet moram nele, então o
# nginx repassa tudo e só serve direto do disco os arquivos estáticos com hash (/_next/static).
#
# O ./deploy.sh (raiz do repositório) instala este arquivo trocando o domínio de exemplo
# (stockwoven.esptechnologies.com.br) e a porta pelos seus. Veja deploy/README.md.
# Este arquivo é a versão HTTP. O Certbot (certbot --nginx -d <domínio>) acrescenta sozinho o
# bloco 443 com o certificado e o redirecionamento 80 -> 443, como no hml.

# Limite do faucet por IP (definido fora do server, vale para o nginx inteiro).
limit_req_zone $binary_remote_addr zone=stockwoven_faucet:10m rate=6r/m;
# Limite geral por IP para o resto (páginas e /api), contra quem tenta derrubar o servidor.
limit_req_zone $binary_remote_addr zone=stockwoven_general:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=stockwoven_conn:10m;

upstream stockwoven_app {
    # Porta do servidor Next.js (PORT no /etc/stockwoven/stockwoven.env)
    server 127.0.0.1:3100;
    keepalive 16;
}

server {
    server_name stockwoven.esptechnologies.com.br;
    listen 80;

    # Não revela a versão do nginx nas respostas e páginas de erro.
    server_tokens off;
    # O site não recebe uploads: nenhum pedido precisa de corpo grande.
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_conn stockwoven_conn 40;

    # Arquivos ocultos (.git, .env...) nunca são servidos, mesmo que apareçam no disco por engano.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # ------------------------------------
    # ARQUIVOS ESTÁTICOS DO BUILD
    # ------------------------------------
    # JS e CSS com hash no nome: nunca mudam, podem ficar em cache por um ano.
    location /_next/static/ {
        alias /var/www/stockwoven/current/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
    }

    # ------------------------------------
    # FAUCET (devnet)
    # ------------------------------------
    # Mesma rota do app, com limite por IP. O próprio faucet já limita 1 envio por minuto por carteira.
    location = /api/faucet {
        limit_req zone=stockwoven_faucet burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        # Só POST: o faucet não responde a mais nada.
        limit_except POST { deny all; }

        proxy_pass http://stockwoven_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ------------------------------------
    # TODO O RESTO: SITE, APP, DOCS E /api
    # ------------------------------------
    # Sem barra no fim do proxy_pass: o caminho chega inteiro ao Next (/api/... continua /api/...).
    location / {
        limit_req zone=stockwoven_general burst=60 nodelay;
        limit_req_status 429;
        # Os cabeçalhos de segurança (CSP, X-Frame-Options, HSTS...) vêm do Next (app/next.config.ts).

        proxy_pass http://stockwoven_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $stockwoven_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Deixa o Next fazer streaming das respostas sem esperar o nginx juntar tudo.
        proxy_buffering off;
    }
}

# Upgrade para WebSocket só quando o cliente pede (senão a conexão segue keep-alive).
map $http_upgrade $stockwoven_connection_upgrade {
    default upgrade;
    ''      '';
}
