[workspace]
members = [
    "programs/*"
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[profile.release]
# Size over speed keeps the program close to its devnet allocation. opt-level "z" overflows the
# stack when deserializing the Vault account.
opt-level = "s"
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
